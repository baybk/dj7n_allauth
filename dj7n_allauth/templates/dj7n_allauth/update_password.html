<html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update password</title>
</head>
<body>
    <div class="container">
        <h1>Hãy cập nhật password cho tài khoản của bạn </h1>

        <form style="border: 1px solid #eee; padding: 2rem; background: #eee;">
            <input style="width: 50%;"  type="text" name="password" style="display: block;" />

            <button style="width: 150px;" type="submit">Cập nhật password</button>

            <button style="width: 100px;">Bỏ quả</button>
        </form>

        <h2>For API platform, use `/dj7n-allauth/api/token/`, api refresh `/dj7n-allauth/api/token/refresh/`</h2>
        <p>Access token JWT for API: {{ access_token }}</p>
        <p>Refresh token JWT for API: {{ refresh_token }}</p>
    </div>
</html>
