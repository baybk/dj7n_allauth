<html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login</title>
</head>
<body>
    <div class="container">
        <h1>Login with Google (For SPA, JS Framework)</h1>
        <p>Click the button below to log in with your Google account.</p>
        
        <button onclick="return loginWithGoogle()">Login with Google</button>
    </div>

    <script>
        function loginWithGoogle() {
            const popupWidth = 500;
            const popupHeight = 500;

            // Tính toán vị trí giữa màn hình
            const left = (window.screen.width / 2) - (popupWidth / 2);
            const top = (window.screen.height / 2) - (popupHeight / 2);

            const loginWindow = window.open(
                '/accounts/google/login/',
                'GoogleLogin',
                `width=${popupWidth},height=${popupHeight},left=${left},top=${top}`
            );

            window.addEventListener("storage", (event) => {
                if (event.key === "google_login_success") {
                    window.location.href = "/dj7n-allauth/me" // hoăc call API gì đó sử dụng Token
                }
            });
        }
    </script>
</html>
